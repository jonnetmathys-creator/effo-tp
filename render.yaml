# Blueprint Render : site statique Astro (preview EFFO-TP)
services:
  - type: web
    name: effo-tp
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
